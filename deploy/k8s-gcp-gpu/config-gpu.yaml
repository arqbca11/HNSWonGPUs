# The worker builds with cuVS (CAGRA, converted to HNSW: Phase 5 decision 2)
# and reports a real card's memory. BUILD_THREADS is the CPU side of the
# conversion and the gate. COST_MODEL=calibrated with the Phase 4 CPU block
# until the GPU calibration replaces Speedup and GPUOverhead.
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker
  namespace: kgpu
data:
  BUILDER: cagra
  BUILD_THREADS: "6"
  # GKE mounts the node's driver (libcuda.so) into the container at
  # /usr/local/nvidia/lib64; the RAPIDS image's search path has only its own
  # CUDA runtime, so without this the runtime cannot find the driver and
  # reports "CUDA driver version is insufficient" (the first GPU session's
  # calibration Job failed on exactly that; decision 10 amended).
  LD_LIBRARY_PATH: /usr/local/nvidia/lib64:/usr/local/cuda/lib64
  WORKER_MEM_BYTES: "23658364928"   # 22563 MiB: what the L4 reported free (DCGM FB_FREE, 2026-11-02); the model’s 24 GiB is the card’s nominal size
  COST_MODEL: calibrated-l4   # cost model v2, the L4 block (decision 14)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler
  namespace: kgpu
data:
  COST_MODEL: calibrated-l4   # cost model v2, the L4 block (decision 14)
  # The cold start, measured on 2026-11-02 (decision 11): 353 s from scaling
  # the worker Deployment up to a registered worker on a pool at zero — about
  # 2.5 min for GKE to provision the g2-standard-8 node with its driver (after
  # a failed spot attempt) and 2.3 min to pull the 6 GB GPU image.
  COLD_START: "350s"
