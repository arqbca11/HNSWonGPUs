# The cost model the cluster runs: cost model v1's measured block (Phase 5
# decisions 6, 7; speedup.md evidence 9), chosen by COST_MODEL=calibrated on
# both the scheduler (its estimates) and the worker (its shutdown decision).
# Single terms can be overridden here with the COST_* names the scheduler's
# main.go lists; none is, so the block is costmodel.Calibrated() exactly.
# (Phase 4 step 4 ran v0 with per-dataset constants here — COST_A=6.525e-08,
# COST_SPEEDUP=2.24, COST_GPU_OVERHEAD=1.35, COST_BANDWIDTH=1.57e8,
# KGPU_ESTIMATE_SIGMA=0.26 — the block evidence 7 and 8 were measured with.)
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler
  namespace: kgpu
data:
  COST_MODEL: calibrated
  KGPU_ESTIMATE_SIGMA: "0.11"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker
  namespace: kgpu
data:
  COST_MODEL: calibrated
