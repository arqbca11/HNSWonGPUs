# Real builds, real time: the cloud cluster exists to measure (decision 7).
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker
  namespace: kgpu
data:
  FAKE_TIME_SCALE: "1"
  BUILDER: hnswlib
  BUILD_THREADS: "8"
  LEASE_SECONDS: "30"
  RENEW_INTERVAL_SECONDS: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler
  namespace: kgpu
data:
  FAKE_TIME_SCALE: "1"
  POLICY: reactive
