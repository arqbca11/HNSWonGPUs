# Phase 2 cluster: one control-plane node, two general worker nodes and two
# stand-in GPU nodes, all Docker containers on the laptop. The GPU nodes carry
# the label kgpu.io/gpu=true and the taint kgpu.io/gpu=true:NoSchedule, so
# only pods that tolerate the taint and select the label (the GPU workers)
# can land there. scripts/kind-up.sh then advertises CARDS_PER_NODE fake GPU
# cards on each of them as the extended resource kgpu.io/gpu-card, the same
# mechanism the NVIDIA device plugin uses for nvidia.com/gpu, so Kubernetes
# itself caps the workers per node at the card count (Phase 2 decision 22).
# The two-node, two-card shape models "two small GPU machines"; how many
# workers to run per card and per machine is an experiment parameter, not an
# assumption (decision 23). Phase 5 swaps the resource name for the real one.
#
#   scripts/kind-up.sh      create the cluster, advertise the cards
#   scripts/kind-down.sh    delete it
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kgpu
nodes:
  - role: control-plane
    # The scheduler's NodePort (30080) is mapped to the laptop, so the shards,
    # which run OUTSIDE the cluster as a database fleet would, reach the
    # scheduler at http://127.0.0.1:30080 (Phase 2 decisions 26, 27).
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        listenAddress: 127.0.0.1
        protocol: TCP
      # Phase 4: the object store's NodePort (30900), for the data tools and
      # the shards on the laptop. Added after the cluster existed; it applies
      # at the next kind-down/kind-up (port-forward until then).
      - containerPort: 30900
        hostPort: 30900
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
    labels:
      kgpu.io/role: general
  - role: worker
    labels:
      kgpu.io/role: general
  - role: worker
    labels:
      kgpu.io/role: gpu
      kgpu.io/gpu: "true"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: kgpu.io/gpu
              value: "true"
              effect: NoSchedule
  - role: worker
    labels:
      kgpu.io/role: gpu
      kgpu.io/gpu: "true"
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          taints:
            - key: kgpu.io/gpu
              value: "true"
              effect: NoSchedule
