# GPU workers: a Deployment of long-running pullers pinned to the GPU nodes by
# a node selector and a toleration (Phase 2 decisions 1, 5), each holding one
# GPU card (the extended resource kgpu.io/gpu-card, decision 22), so the
# cluster's card count caps the workers and `replicas` chooses how many of the
# cards to use. Phase 5 renames the resource to nvidia.com/gpu. WORKER_ID is
# the pod name. The probe server runs on its own thread (port 8081): /livez is
# liveness, /healthz (a recent heartbeat) is readiness. SIGTERM gives the
# worker terminationGracePeriodSeconds to finish or release its build.
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker
  namespace: kgpu
data:
  # Phase 2 still runs fake builds; these are test-friendly values (short leases,
  # 10x time scale) so failure injection fits in seconds. Phase 4 changes them.
  # 24 GiB: an L4/A10G-class card, the pool the published cuVS index-build
  # benchmarks run on; the same number the workload presets assume (Phase 3
  # decision 26).
  WORKER_MEM_BYTES: "25769803776"
  LEASE_SECONDS: "10"
  RENEW_INTERVAL_SECONDS: "3"
  HEARTBEAT_INTERVAL_SECONDS: "3"
  POLL_INTERVAL_SECONDS: "0.5"
  FAKE_TIME_SCALE: "10"
  SHUTDOWN_FINISH_BUDGET_SECONDS: "5"
  HEALTH_ADDR: ":8081"
  LOG_FORMAT: json
  # Phase 4 (decision 18): hnswlib runs the builder CLI against the object
  # store for rounds that carry a dataset; fake sleeps for the modeled time.
  # Switching needs a restart (the value is read at start).
  BUILDER: fake
  BUILD_THREADS: "8"
  RECALL_MIN: "0.9"
---
# Headless Service over the workers: nothing calls them (they pull), it exists
# so the ServiceMonitor can find their probe/metrics port (Phase 2 step 5).
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: kgpu
  labels: {app: worker}
spec:
  clusterIP: None
  selector:
    app: worker
  ports:
    - name: health
      port: 8081
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: kgpu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      nodeSelector:
        kgpu.io/gpu: "true"
      # Soft spread (decision 39): prefer balancing workers across GPU nodes so a
      # one-node drain halves the pool instead of possibly emptying it (decision
      # 38). ScheduleAnyway keeps it a preference: with one node full or cordoned
      # the pod still schedules, so packing stays legal and nothing goes Pending.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: worker
      tolerations:
        - key: kgpu.io/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      # SIGTERM, then this long, then SIGKILL. The worker releases a long build
      # within a second and finishes a short one inside the budget above.
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: kgpu-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: worker
            - secretRef:
                name: objectstore     # S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, S3_BUCKET (Phase 4)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: DATABASE_URL
            - name: WORKER_ID          # the pod name, from the downward API
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WORKER_NODE        # the machine it landed on, same mechanism:
              valueFrom:               # workers on one node share its network link,
                fieldRef:              # so transfer estimates group by it (decision 11)
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /livez, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            # A hung process cannot act on SIGTERM, so a liveness restart must not
            # wait out the pod's 30 s grace period (observed: 52 s to restart).
            terminationGracePeriodSeconds: 5
          resources:
            # Phase 4: a real hnswlib build holds the shard's vectors, the graph
            # and the serialised index at once -- about 1 GiB for SIFT's largest
            # 6-way shard (408k x 128). The Phase 2 limit of 512Mi killed the
            # container on that build (bug 18).
            requests: {cpu: "100m", memory: "512Mi"}
            # One card per worker. Extended resources are whole and exclusive;
            # a request equal to the limit is required, so only the limit is set.
            limits: {memory: "2Gi", kgpu.io/gpu-card: "1"}
