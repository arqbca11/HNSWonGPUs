[project]
name = "kgpu-worker"
version = "0.1.0"
description = "GPU worker: pulls index builds from Postgres, renews its lease, runs the build behind one interface, publishes the result."
requires-python = ">=3.12"
dependencies = [
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.2,<4",
    "kgpu-builder",
]

[tool.uv.sources]
kgpu-builder = { path = "../builder", editable = true }

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kgpu_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rA"
