[project]
name = "kgpu-builder"
version = "0.1.0"
description = "Phase 4: the dataset tools (download, Zipf split, exact ground truth, object-store upload) and, from step 2, the hnswlib builder CLI that both the Python worker and the Go shard run."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0,<3",
    "h5py>=3.11,<4",
    "boto3>=1.35,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kgpu_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rA"
